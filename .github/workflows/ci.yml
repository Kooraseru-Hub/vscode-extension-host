name: Extension Host

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build VSIX
        run: npm run package:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-host-vsix
          path: dist/vscode-extension-host.vsix
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vscode-extension-host-vsix
          path: dist
      - name: Publish latest VSIX
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/vscode-extension-host.vsix --clobber
          else
            gh release create latest dist/vscode-extension-host.vsix --target "$GITHUB_SHA" --title 'Kooraseru Extension Host (latest)' --notes 'Latest successful main-branch build.'
          fi
      - name: Publish tagged VSIX
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/vscode-extension-host.vsix --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
