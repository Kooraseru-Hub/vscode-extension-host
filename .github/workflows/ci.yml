name: Extension Host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build VSIX
        run: npm run package:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-host-vsix
          path: dist/vscode-extension-host.vsix
          if-no-files-found: error

